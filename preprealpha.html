<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>metagetta • music metadata tool</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Expanded:wght@800;900&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --bg-main: #132A0A;
            --bg-cards: #404A29;
            --text-main: #FAFFD6;
            --text-muted: rgba(250, 255, 214, 0.5);
            --text-link: #F9FFB8;
            --text-highlight-max: #F2FF67;
            --toast-error-bg: #4A2929;
            --toast-error-text: #FFC0B8;

            --font-branding: 'Saira Expanded', sans-serif;
            --font-body: 'Saira', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-img {
            height: 28px;
        }

        .brand-desc-img {
            height: 16px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions .material-symbols-outlined {
            color: var(--text-link);
            cursor: pointer;
            font-size: 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px 32px 32px;
        }

        /* Sidebar & Search Controls */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-header {
            font-family: var(--font-branding);
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .search-type-selector, .storefront-selector {
            color: var(--text-link);
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            padding: 0;
            outline: none;
        }

        .storefront-selector {
            width: 40px;
        }

        .search-input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-cards);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .search-input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.9rem;
            width: 100%;
        }

        .search-input-box input::placeholder {
            color: var(--text-muted);
        }

        .search-results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-item img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
        }

        .result-info .item-title {
            font-family: var(--font-branding);
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .result-info .item-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Detail Display Panel */
        .detail-view {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .album-header-card {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 24px;
        }

        .artwork-container img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            object-fit: cover;
        }

        .meta-header h2 {
            font-family: var(--font-branding);
            font-weight: 900;
            font-size: 2rem;
            margin: 0 0 4px 0;
            color: var(--text-main);
        }

        .artist-name {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .album-sub-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Quality Badges Header Styling */
        .badges-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0 14px 0;
            flex-wrap: wrap;
        }

        .badge-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-branding);
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .badge-img {
            height: 18px;
            /* Recolor dark/black SVGs to match #FAFFD6 main text tint */
            filter: invert(98%) sepia(18%) saturate(415%) hue-rotate(24deg) brightness(105%) contrast(104%);
        }

        .badge-separator {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Truncated Editorial Notes */
        .editorial-notes {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 650px;
        }

        .editorial-notes-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .editorial-notes.expanded .editorial-notes-text {
            display: block;
            overflow: visible;
        }

        .notes-toggle {
            color: var(--text-link);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
            margin-left: 4px;
        }

        /* Tracklist Styling */
        .tracklist {
            width: 100%;
            border-collapse: collapse;
        }

        .tracklist td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(250, 255, 214, 0.1);
            font-size: 0.9rem;
        }

        .track-name {
            color: var(--text-main);
        }

        .track-qualities {
            text-align: right;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .track-duration {
            text-align: right;
            color: var(--text-main);
            width: 60px;
        }

        /* Toast Notifications */
        .toast-error {
            background-color: var(--toast-error-bg);
            color: var(--toast-error-text);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            position: fixed;
            bottom: 32px;
            right: 32px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .toast-error .material-symbols-outlined {
            font-size: 32px;
        }

        .toast-error-title {
            font-family: var(--font-branding);
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .toast-error-body {
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .toast-error-code {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 12px;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="assets/branding/logo.svg" alt="metagetta" class="metagetta">
            <img src="assets/branding/description.svg" alt="music metadata tool" class="apple music metadata tool">
        </div>
        <div class="header-actions">
            <span class="material-symbols-outlined">help</span>
            <span class="material-symbols-outlined">info</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Search -->
        <div class="sidebar">
            <div class="search-header">
                search 
                <select id="searchTypeSelect" class="search-type-selector">
                    <option value="albums">albums</option>
                    <option value="artists">artists</option>
                    <option value="playlists">playlists</option>
                </select>
                in 
                <input type="text" id="storefrontInput" class="storefront-selector" value="us" maxlength="5">
            </div>
            
            <div class="search-input-box">
                <span class="material-symbols-outlined" style="color: var(--text-muted); font-size: 18px;">search</span>
                <input type="text" id="searchInput" placeholder="type or paste a link">
            </div>

            <div class="search-results-list" id="searchResultsList"></div>
        </div>

        <!-- Detail View Target Panel -->
        <div class="detail-view" id="detailView"></div>
    </div>

    <!-- Error Toast Markup -->
    <div id="toastContainer"></div>

    <script>
        const WORKER_ENDPOINT = "https://amphoreus.ejpoacc.workers.dev";

        function formatDuration(ms) {
            if (!ms) return "--:--";
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function triggerErrorToast(message, statusCode = "404") {
            const toastContainer = document.getElementById("toastContainer");
            toastContainer.innerHTML = `
                <div class="toast-error">
                    <span class="material-symbols-outlined">error</span>
                    <div>
                        <div class="toast-error-title">Error</div>
                        <div class="toast-error-body">${message}</div>
                        <div class="toast-error-code">Code ${statusCode}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                toastContainer.innerHTML = "";
            }, 5000);
        }

        async function executeSearch() {
            const query = document.getElementById("searchInput").value.trim();
            const storefront = document.getElementById("storefrontInput").value.trim() || "us";
            const searchType = document.getElementById("searchTypeSelect").value;
            
            if (!query) return;

            const resultsContainer = document.getElementById("searchResultsList");
            resultsContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted);">Searching...</div>';

            try {
                const response = await fetch(`${WORKER_ENDPOINT}/v1/catalog/${storefront}/search?term=${encodeURIComponent(query)}&types=${searchType}`);
                const data = await response.json();

                const results = data.results?.[searchType]?.data || [];
                renderSearchResults(results, searchType);
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = "";
                triggerErrorToast("No results/Forbidden/Empty results/ Incorrect query/Not found", "404");
            }
        }

        function renderSearchResults(items, type) {
            const container = document.getElementById("searchResultsList");
            container.innerHTML = "";

            if (items.length === 0) {
                triggerErrorToast("No results found for query", "404");
                return;
            }

            items.forEach(item => {
                const attrs = item.attributes;
                const artworkUrl = attrs.artwork?.url?.replace("{w}", "120").replace("{h}", "120") || "";

                const row = document.createElement("div");
                row.className = "result-item";
                row.onclick = () => fetchItemDetails(item.id, type);

                let subtitle = attrs.artistName || "";
                if (attrs.releaseDate) subtitle += ` • ${attrs.releaseDate.substring(0, 4)}`;
                if (type === "artists") subtitle = "Artist";
                if (type === "playlists") subtitle = attrs.curatorName || "Playlist";

                row.innerHTML = `
                    <img src="${artworkUrl || 'https://via.placeholder.com/120'}" alt="${attrs.name}">
                    <div class="result-info">
                        <div class="item-title">${attrs.name}</div>
                        <div class="item-sub">${subtitle}</div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function fetchItemDetails(itemId, type) {
            const storefront = document.getElementById("storefrontInput").value.trim() || "us";
            
            try {
                const response = await fetch(`${WORKER_ENDPOINT}/v1/catalog/${storefront}/${type}/${itemId}`);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    if (type === "albums") {
                        renderAlbumDetail(data.data[0]);
                    } else {
                        renderGenericDetail(data.data[0], type);
                    }
                }
            } catch (err) {
                console.error(err);
                triggerErrorToast("Failed to fetch item details", "500");
            }
        }

        function toggleEditorialNotes() {
            const notesContainer = document.getElementById("editorialNotesContainer");
            const btn = document.getElementById("notesToggleBtn");
            if (notesContainer.classList.contains("expanded")) {
                notesContainer.classList.remove("expanded");
                btn.textContent = "More";
            } else {
                notesContainer.classList.add("expanded");
                btn.textContent = "Less";
            }
        }

        function renderAlbumDetail(album) {
            const attrs = album.attributes;
            const detailView = document.getElementById("detailView");
            const artworkUrl = attrs.artwork?.url?.replace("{w}", "600").replace("{h}", "600") || "";
            const tracks = album.relationships?.tracks?.data || [];

            // Header Quality Badges with Icons + Text
            const audioTraits = attrs.audioTraits || [];
            const badgeItems = [];
            
            if (audioTraits.includes("spatial") || audioTraits.includes("atmos")) {
                badgeItems.push(`
                    <span class="badge-item">
                        <img src="assets/badges/dolby.svg" class="badge-img" alt="Dolby Atmos">
                        Dolby Atmos
                    </span>
                `);
            }
            if (audioTraits.includes("hi-res-lossless")) {
                badgeItems.push(`
                    <span class="badge-item">
                        <img src="assets/badges/hires.svg" class="badge-img" alt="Hi-Res Lossless">
                        Hi-Res Lossless
                    </span>
                `);
            } else if (audioTraits.includes("lossless") || audioTraits.includes("lossy-stereo")) {
                badgeItems.push(`
                    <span class="badge-item">
                        <img src="assets/badges/lossless.svg" class="badge-img" alt="Lossless">
                        Lossless
                    </span>
                `);
            }

            const badgesHtml = badgeItems.join(' <span class="badge-separator">•</span> ');

            // Tracklist Table Generation with Track-level Qualities
            let tracklistRows = "";
            tracks.forEach(track => {
                const tAttrs = track.attributes;
                const trackTraits = tAttrs.audioTraits || [];
                
                let qualitiesDisplay = [];
                if (trackTraits.includes("spatial") || trackTraits.includes("atmos")) qualitiesDisplay.push("Dolby Atmos");
                if (trackTraits.includes("hi-res-lossless")) qualitiesDisplay.push("Hi-Res Lossless");
                else if (trackTraits.includes("lossless")) qualitiesDisplay.push("Lossless");

                const qualitiesText = qualitiesDisplay.join(" · ") || (tAttrs.hasHLS ? "Lossless" : "");

                tracklistRows += `
                    <tr>
                        <td class="track-name">${tAttrs.name}</td>
                        <td class="track-qualities">${qualitiesText}</td>
                        <td class="track-duration">${formatDuration(tAttrs.durationInMillis)}</td>
                    </tr>
                `;
            });

            const editorialRaw = attrs.editorialNotes?.standard || attrs.editorialNotes?.short || "";
            let editorialHtml = "";
            if (editorialRaw) {
                editorialHtml = `
                    <div class="editorial-notes" id="editorialNotesContainer">
                        <span class="editorial-notes-text">${editorialRaw}</span>
                        <span class="notes-toggle" id="notesToggleBtn" onclick="toggleEditorialNotes()">More</span>
                    </div>
                `;
            }

            detailView.innerHTML = `
                <div class="album-header-card">
                    <div class="artwork-container">
                        <img src="${artworkUrl}" alt="${attrs.name}">
                    </div>
                    <div class="meta-header">
                        <h2>${attrs.name}</h2>
                        <div class="artist-name">${attrs.artistName}</div>
                        <div class="album-sub-meta">${attrs.genreNames ? attrs.genreNames[0] : ''} • ${attrs.releaseDate ? attrs.releaseDate.substring(0, 4) : ''}</div>
                        
                        <div class="badges-row">
                            ${badgesHtml}
                        </div>

                        ${editorialHtml}
                    </div>
                </div>

                <table class="tracklist">
                    <tbody>
                        ${tracklistRows}
                    </tbody>
                </table>
            `;
        }

        function renderGenericDetail(item, type) {
            const attrs = item.attributes;
            const detailView = document.getElementById("detailView");
            const artworkUrl = attrs.artwork?.url?.replace("{w}", "600").replace("{h}", "600") || "";

            detailView.innerHTML = `
                <div class="album-header-card">
                    <div class="artwork-container">
                        <img src="${artworkUrl || 'https://via.placeholder.com/600'}" alt="${attrs.name}">
                    </div>
                    <div class="meta-header">
                        <h2>${attrs.name}</h2>
                        <div class="artist-name">${attrs.artistName || attrs.curatorName || ''}</div>
                        <div class="album-sub-meta">${type.toUpperCase()}</div>
                    </div>
                </div>
            `;
        }

        document.getElementById("searchInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") executeSearch();
        });

        document.getElementById("searchTypeSelect").addEventListener("change", () => {
            if (document.getElementById("searchInput").value.trim()) {
                executeSearch();
            }
        });
    </script>
</body>
</html>
