<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>metagetta • music metadata tool</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Expanded:wght@800;900&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --bg-main: #132A0A;
            --bg-cards: #404A29;
            --text-main: #FAFFD6;
            --text-muted: rgba(250, 255, 214, 0.5);
            --text-link: #F9FFB8;
            --text-highlight-max: #F2FF67;
            --toast-error-bg: #4A2929;
            --toast-error-text: #FFC0B8;

            --font-branding: 'Saira Expanded', sans-serif;
            --font-body: 'Saira', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-img {
            height: 28px;
        }

        .brand-desc-img {
            height: 16px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions .material-symbols-outlined {
            color: var(--text-link);
            cursor: pointer;
            font-size: 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px 32px 32px;
        }

        /* Sidebar & Search Controls */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-header {
            font-family: var(--font-branding);
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .storefront-selector {
            color: var(--text-link);
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            padding: 0;
            outline: none;
            width: 40px;
        }

        .search-input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-cards);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .search-input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.9rem;
            width: 100%;
        }

        .search-input-box input::placeholder {
            color: var(--text-muted);
        }

        .search-results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-item img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
        }

        .result-info .item-title {
            font-family: var(--font-branding);
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .result-info .item-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Content Display Panel */
        .detail-view {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .album-header-card {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 24px;
        }

        .artwork-container img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            object-fit: cover;
        }

        .meta-header h2 {
            font-family: var(--font-branding);
            font-weight: 900;
            font-size: 2rem;
            margin: 0 0 4px 0;
            color: var(--text-main);
        }

        .artist-name {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .album-sub-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badges-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0 14px 0;
        }

        .badge-img {
            height: 18px;
        }

        .editorial-notes {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 600px;
        }

        /* Tracklist Styling */
        .tracklist {
            width: 100%;
            border-collapse: collapse;
        }

        .tracklist td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(250, 255, 214, 0.1);
            font-size: 0.9rem;
        }

        .track-name {
            color: var(--text-main);
        }

        .track-qualities {
            text-align: right;
            color: var(--text-muted);
        }

        .track-duration {
            text-align: right;
            color: var(--text-main);
            width: 60px;
        }

        /* Toast Notifications */
        .toast-error {
            background-color: var(--toast-error-bg);
            color: var(--toast-error-text);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            position: fixed;
            bottom: 32px;
            right: 32px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .toast-error .material-symbols-outlined {
            font-size: 32px;
        }

        .toast-error-title {
            font-family: var(--font-branding);
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .toast-error-body {
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .toast-error-code {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 12px;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="/ampthing/assets/branding/logo.svg" alt="metagetta" class="brand-logo-img">
            <img src="/ampthing/assets/branding/description.svg" alt="music metadata tool" class="brand-desc-img">
        </div>
        <div class="header-actions">
            <span class="material-symbols-outlined">help</span>
            <span class="material-symbols-outlined">info</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Search -->
        <div class="sidebar">
            <div class="search-header">
                search albums in 
                <input type="text" id="storefrontInput" class="storefront-selector" value="kr" maxlength="5">
            </div>
            
            <div class="search-input-box">
                <span class="material-symbols-outlined" style="color: var(--text-muted); font-size: 18px;">search</span>
                <input type="text" id="searchInput" placeholder="type or paste a link">
            </div>

            <div class="search-results-list" id="searchResultsList"></div>
        </div>

        <!-- Detail View Target Panel -->
        <div class="detail-view" id="detailView">
            <!-- Rendered dynamically on item selection -->
        </div>
    </div>

    <!-- Error Toast Markup -->
    <div id="toastContainer"></div>

    <script>
        const WORKER_ENDPOINT = "https://amphoreus.ejpoacc.workers.dev";

        function formatDuration(ms) {
            if (!ms) return "--:--";
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function triggerErrorToast(message, statusCode = "404") {
            const toastContainer = document.getElementById("toastContainer");
            toastContainer.innerHTML = `
                <div class="toast-error">
                    <span class="material-symbols-outlined">error</span>
                    <div>
                        <div class="toast-error-title">Error</div>
                        <div class="toast-error-body">${message}</div>
                        <div class="toast-error-code">Code ${statusCode}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                toastContainer.innerHTML = "";
            }, 5000);
        }

        async function executeSearch() {
            const query = document.getElementById("searchInput").value.trim();
            const storefront = document.getElementById("storefrontInput").value.trim() || "kr";
            
            if (!query) return;

            const resultsContainer = document.getElementById("searchResultsList");
            resultsContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted);">Searching...</div>';

            try {
                const response = await fetch(`${WORKER_ENDPOINT}/v1/catalog/${storefront}/search?term=${encodeURIComponent(query)}&types=albums`);
                const data = await response.json();

                const albums = data.results?.albums?.data || [];
                renderSearchResults(albums);
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = "";
                triggerErrorToast("No results/Forbidden/Empty results/ Incorrect query/Not found", "404");
            }
        }

        function renderSearchResults(albums) {
            const container = document.getElementById("searchResultsList");
            container.innerHTML = "";

            if (albums.length === 0) {
                triggerErrorToast("No results found for query", "404");
                return;
            }

            albums.forEach(album => {
                const attrs = album.attributes;
                const artworkUrl = attrs.artwork?.url?.replace("{w}", "120").replace("{h}", "120") || "";

                const item = document.createElement("div");
                item.className = "result-item";
                item.onclick = () => fetchAlbumDetails(album.id);

                item.innerHTML = `
                    <img src="${artworkUrl}" alt="${attrs.name}">
                    <div class="result-info">
                        <div class="item-title">${attrs.name}</div>
                        <div class="item-sub">${attrs.artistName} • ${attrs.releaseDate ? attrs.releaseDate.substring(0, 4) : ''}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function fetchAlbumDetails(albumId) {
            const storefront = document.getElementById("storefrontInput").value.trim() || "kr";
            
            try {
                const response = await fetch(`${WORKER_ENDPOINT}/v1/catalog/${storefront}/albums/${albumId}`);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    renderAlbumDetail(data.data[0]);
                }
            } catch (err) {
                console.error(err);
                triggerErrorToast("Failed to fetch album details", "500");
            }
        }

        function renderAlbumDetail(album) {
            const attrs = album.attributes;
            const detailView = document.getElementById("detailView");
            const artworkUrl = attrs.artwork?.url?.replace("{w}", "600").replace("{h}", "600") || "";
            const tracks = album.relationships?.tracks?.data || [];

            // Quality Badge Mapping
            const audioTraits = attrs.audioTraits || [];
            let badgesHtml = "";
            if (audioTraits.includes("lossy-stereo") || audioTraits.includes("lossless")) {
                badgesHtml += `<img src="/ampthing/assets/badges/lossless.svg" class="badge-img" alt="Lossless">`;
            }
            if (audioTraits.includes("hi-res-lossless")) {
                badgesHtml += `<img src="/ampthing/assets/badges/hires.svg" class="badge-img" alt="Hi-Res Lossless">`;
            }
            if (audioTraits.includes("spatial") || audioTraits.includes("atmos")) {
                badgesHtml += `<img src="/ampthing/assets/badges/dolby.svg" class="badge-img" alt="Dolby Atmos">`;
            }

            // Tracklist Table Generation
            let tracklistRows = "";
            tracks.forEach((track, index) => {
                const tAttrs = track.attributes;
                const trackTraits = tAttrs.audioTraits || [];
                let traitLabel = trackTraits.length > 0 ? "Qualities" : "";

                tracklistRows += `
                    <tr>
                        <td class="track-name">${tAttrs.name}</td>
                        <td class="track-qualities">${traitLabel}</td>
                        <td class="track-duration">${formatDuration(tAttrs.durationInMillis)}</td>
                    </tr>
                `;
            });

            detailView.innerHTML = `
                <div class="album-header-card">
                    <div class="artwork-container">
                        <img src="${artworkUrl}" alt="${attrs.name}">
                    </div>
                    <div class="meta-header">
                        <h2>${attrs.name}</h2>
                        <div class="artist-name">${attrs.artistName}</div>
                        <div class="album-sub-meta">${attrs.genreNames ? attrs.genreNames[0] : ''} • ${attrs.releaseDate ? attrs.releaseDate.substring(0, 4) : ''}</div>
                        
                        <div class="badges-row">
                            ${badgesHtml}
                        </div>

                        <div class="editorial-notes">
                            ${attrs.editorialNotes?.standard || attrs.editorialNotes?.short || 'Editorial notes, if available. Clicking shows it bigger and lets user copy start and full note.'}
                        </div>
                    </div>
                </div>

                <table class="tracklist">
                    <tbody>
                        ${tracklistRows}
                    </tbody>
                </table>
            `;
        }

        document.getElementById("searchInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") executeSearch();
        });
    </script>
</body>
</html>
