<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music AMP Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'SF Pro';
            src: url('/assets/font/SF-Pro.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'SF Pro', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .glass-panel { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans antialiased selection:bg-rose-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-zinc-800/80 glass-panel sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-pink-500 flex items-center justify-center shadow-lg shadow-rose-950/50">
                    <i class="fa-solid fa-music text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold tracking-tight text-white leading-none text-lg">AMP Explorer</h1>
                    <span class="text-[10px] font-mono text-zinc-400">Apple Music API Metadata Inspector</span>
                </div>
            </div>

            <button id="openConfigBtn" class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white px-3.5 py-1.5 rounded-lg border border-zinc-800 text-xs font-medium transition shadow-sm">
                <i class="fa-solid fa-gear text-zinc-400"></i>
                <span>API Settings</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-grow w-full space-y-6">

        <!-- Search Controls -->
        <div class="glass-panel border border-zinc-800/80 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex flex-col sm:flex-row gap-2.5">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Paste Apple Music URL or search term (e.g., KiiiKiii, 6796609794)..." 
                           class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition">
                </div>
                
                <div class="flex gap-2">
                    <select id="typeSelect" class="bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-rose-500 transition cursor-pointer">
                        <option value="songs">Songs</option>
                        <option value="albums">Albums</option>
                        <option value="artists">Artists</option>
                        <option value="playlists">Playlists</option>
                        <option value="music-videos">Videos</option>
                    </select>

                    <button id="searchBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-rose-950/40 flex items-center gap-2 flex-shrink-0">
                        <span>Search</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Alert Banner -->
        <div id="statusMessage" class="hidden text-xs font-mono p-3.5 rounded-xl border flex items-center gap-3 transition"></div>

        <!-- Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Results List -->
            <section class="lg:col-span-5 space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Catalog Results</h2>
                    <span id="resultsCount" class="text-[11px] font-mono text-zinc-500">0 items</span>
                </div>
                
                <div id="resultsContainer" class="space-y-2.5 max-h-[70vh] overflow-y-auto pr-1 custom-scrollbar">
                    <div class="text-center py-12 border border-dashed border-zinc-800 rounded-2xl">
                        <i class="fa-solid fa-compact-disc text-3xl text-zinc-700 mb-2 animate-spin-slow"></i>
                        <p class="text-xs text-zinc-500">Search for tracks or paste a song URL to inspect API payloads</p>
                    </div>
                </div>
            </section>

            <!-- Right Column: JSON Payload Inspector -->
            <section class="lg:col-span-7 space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400">API Response Payload</h2>
                    <button id="copyJsonBtn" class="text-xs text-zinc-400 hover:text-white flex items-center gap-1.5 bg-zinc-900 px-2.5 py-1 rounded border border-zinc-800 transition">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copy Raw JSON</span>
                    </button>
                </div>

                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 font-mono text-xs overflow-x-auto max-h-[70vh] custom-scrollbar shadow-inner">
                    <pre id="jsonViewer" class="text-rose-300/90 leading-relaxed"><code>// Raw API payload response will render here...</code></pre>
                </div>
            </section>
        </div>
    </main>

    <!-- Config Modal -->
    <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-lg text-white">Proxy & Token Configuration</h3>
                <button id="closeModalBtn" class="text-zinc-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Cloudflare Worker Proxy Domain</label>
                    <input type="text" id="proxyUrlInput" value="https://amp.ejpoacc.workers.dev" 
                           class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs font-mono text-zinc-200 focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Apple Music Developer JWT Token</label>
                    <textarea id="tokenInput" rows="5" placeholder="Bearer eyJhbGciOi..." 
                              class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs font-mono text-zinc-200 focus:outline-none focus:border-rose-500"></textarea>
                    <p class="text-[11px] text-zinc-500 mt-1">Ensure the token includes the exact <code>Bearer </code> prefix.</p>
                </div>
            </div>

            <div class="flex justify-end gap-2.5 pt-2">
                <button id="cancelModalBtn" class="px-4 py-2 rounded-xl text-xs font-medium text-zinc-300 hover:bg-zinc-800 border border-zinc-800">Cancel</button>
                <button id="saveTokenBtn" class="px-5 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-950/50">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let storefront = "us";
        let currentAudio = null;

        // DOM Elements
        const searchInput = document.getElementById("searchInput");
        const typeSelect = document.getElementById("typeSelect");
        const searchBtn = document.getElementById("searchBtn");
        const resultsContainer = document.getElementById("resultsContainer");
        const resultsCount = document.getElementById("resultsCount");
        const jsonViewer = document.getElementById("jsonViewer");
        const statusMessage = document.getElementById("statusMessage");
        const copyJsonBtn = document.getElementById("copyJsonBtn");

        const configModal = document.getElementById("configModal");
        const openConfigBtn = document.getElementById("openConfigBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const cancelModalBtn = document.getElementById("cancelModalBtn");
        const saveTokenBtn = document.getElementById("saveTokenBtn");
        const tokenInput = document.getElementById("tokenInput");
        const proxyUrlInput = document.getElementById("proxyUrlInput");

        // App Init
        tokenInput.value = localStorage.getItem("amusic_token") || "";
        proxyUrlInput.value = localStorage.getItem("amusic_proxy") || "https://amp.ejpoacc.workers.dev";

        // Modal Handlers
        const toggleModal = (show) => configModal.classList.toggle("hidden", !show);
        openConfigBtn.onclick = () => toggleModal(true);
        closeModalBtn.onclick = () => toggleModal(false);
        cancelModalBtn.onclick = () => toggleModal(false);

        saveTokenBtn.onclick = () => {
            localStorage.setItem("amusic_token", tokenInput.value.trim());
            localStorage.setItem("amusic_proxy", proxyUrlInput.value.trim().replace(/\/$/, ""));
            toggleModal(false);
            showStatus("Configuration saved successfully!", "success");
        };

        function showStatus(msg, type = "info") {
            statusMessage.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation text-red-400' : type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-sky-400'}"></i>
                <span>${msg}</span>
            `;
            statusMessage.className = `text-xs font-mono p-3.5 rounded-xl border flex items-center gap-3 transition ${
                type === 'error' ? 'bg-red-950/40 border-red-900/60 text-red-200' :
                type === 'success' ? 'bg-emerald-950/40 border-emerald-900/60 text-emerald-200' :
                'bg-zinc-900 border-zinc-800 text-zinc-300'
            }`;
            statusMessage.classList.remove("hidden");
        }

        // Core API Fetch Proxy Handler
        async function fetchAMP(endpoint) {
            const token = localStorage.getItem("amusic_token");
            const proxyUrl = localStorage.getItem("amusic_proxy") || "https://amp.ejpoacc.workers.dev";

            if (!token) {
                toggleModal(true);
                throw new Error("Missing developer token. Please set your Bearer token in Settings.");
            }

            const cleanEndpoint = endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
            const targetUrl = `${proxyUrl}${cleanEndpoint}`;

            const response = await fetch(targetUrl, {
                headers: {
                    "Authorization": token.startsWith("Bearer ") ? token : `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error(`API HTTP Error: ${response.status} (${response.statusText})`);
            }

            return await response.json();
        }

        // Search Executor
        async function handleSearch() {
            const query = searchInput.value.trim();
            const type = typeSelect.value;
            if (!query) return;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            resultsContainer.innerHTML = `<div class="text-center py-10"><i class="fa-solid fa-spinner animate-spin text-rose-500 text-2xl"></i></div>`;
            showStatus("Querying Apple Music API...", "info");

            try {
                let endpoint;
                
                if (query.includes("music.apple.com")) {
                    const urlObj = new URL(query);
                    const pathSegments = urlObj.pathname.split('/').filter(Boolean);
                    const urlStorefront = pathSegments[0] || storefront;
                    const urlType = pathSegments[1];
                    const urlId = pathSegments[pathSegments.length - 1].split('?')[0];

                    endpoint = `/v1/catalog/${urlStorefront}/${urlType}/${urlId}?include=editorialVideo,artists,albums`;
                } else {
                    endpoint = `/v1/catalog/${storefront}/search?term=${encodeURIComponent(query)}&types=${type}&limit=24&include=editorialVideo`;
                }

                const data = await fetchAMP(endpoint);
                jsonViewer.textContent = JSON.stringify(data, null, 2);

                const items = data.data || data.results?.[type]?.data || [];
                renderResults(items);
                showStatus(`Successfully fetched ${items.length} item(s)`, "success");

            } catch (err) {
                jsonViewer.textContent = `// Error executing request:\n${err.message}`;
                showStatus(err.message, "error");
                resultsContainer.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">Failed to load results. Check settings.</div>`;
            }
        }

        function playPreview(url, btn) {
            if (currentAudio) {
                currentAudio.pause();
                document.querySelectorAll('.preview-btn i').forEach(icon => {
                    icon.className = 'fa-solid fa-play text-xs';
                });
                if (currentAudio.src === url) {
                    currentAudio = null;
                    return;
                }
            }

            currentAudio = new Audio(url);
            currentAudio.play();
            const icon = btn.querySelector('i');
            if (icon) icon.className = 'fa-solid fa-pause text-xs';

            currentAudio.onended = () => {
                if (icon) icon.className = 'fa-solid fa-play text-xs';
                currentAudio = null;
            };
        }

        function renderResults(items) {
            resultsContainer.innerHTML = "";
            resultsCount.textContent = `${items.length} item(s)`;

            if (!items.length) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">No matching catalog items found.</div>`;
                return;
            }

            items.forEach(item => {
                const attr = item.attributes || {};
                const artworkUrl = attr.artwork ? attr.artwork.url.replace('{w}', '300').replace('{h}', '300') : '';
                const previewUrl = attr.previews?.[0]?.url || '';
                const durationMin = attr.durationInMillis ? `${Math.floor(attr.durationInMillis / 60000)}:${Math.floor((attr.durationInMillis % 60000) / 1000).toString().padStart(2, '0')}` : '';

                const card = document.createElement("div");
                card.className = "bg-zinc-900 border border-zinc-800/80 rounded-xl p-3 flex gap-3 items-center hover:border-zinc-700 transition cursor-pointer group relative";
                
                card.innerHTML = `
                    <div class="relative w-14 h-14 flex-shrink-0">
                        ${artworkUrl ? `<img src="${artworkUrl}" class="w-14 h-14 rounded-lg object-cover bg-zinc-950 shadow">` : `<div class="w-14 h-14 rounded-lg bg-zinc-800 flex items-center justify-center"><i class="fa-solid fa-music text-zinc-600"></i></div>`}
                        ${previewUrl ? `
                            <button class="preview-btn absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center rounded-lg transition text-white">
                                <i class="fa-solid fa-play text-xs"></i>
                            </button>
                        ` : ''}
                    </div>

                    <div class="flex-grow min-w-0 space-y-0.5">
                        <div class="flex items-center justify-between gap-2">
                            <h4 class="font-bold text-xs text-white truncate group-hover:text-rose-400 transition">${attr.name || 'Untitled'}</h4>
                            ${durationMin ? `<span class="text-[10px] font-mono text-zinc-500 flex-shrink-0">${durationMin}</span>` : ''}
                        </div>
                        <p class="text-[11px] text-zinc-400 truncate">${attr.artistName || attr.curatorName || 'Unknown Artist'}</p>
                        <p class="text-[10px] text-zinc-500 truncate">${attr.albumName || attr.genreNames?.[0] || ''}</p>
                        
                        <div class="flex items-center gap-2 pt-1">
                            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400">${item.type}</span>
                            <span class="text-[9px] font-mono text-zinc-500">ID: ${item.id}</span>
                            ${attr.hasLyrics ? `<span class="text-[8px] font-bold px-1 rounded bg-rose-950 text-rose-300 border border-rose-800/50">LYRICS</span>` : ''}
                        </div>
                    </div>
                `;

                // Quick Play Button Click
                const playBtn = card.querySelector('.preview-btn');
                if (playBtn) {
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        playPreview(previewUrl, playBtn);
                    };
                }

                // Card Payload Inspect Click
                card.onclick = () => {
                    jsonViewer.textContent = JSON.stringify(item, null, 2);
                };

                resultsContainer.appendChild(card);
            });
        }

        // Copy JSON Button
        copyJsonBtn.onclick = () => {
            navigator.clipboard.writeText(jsonViewer.textContent);
            showStatus("JSON copied to clipboard!", "success");
        };

        // Event Handlers
        searchBtn.onclick = handleSearch;
        searchInput.onkeypress = (e) => { if (e.key === "Enter") handleSearch(); };
    </script>
</body>
</html>
